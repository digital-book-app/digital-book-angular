<mat-drawer-container [hasBackdrop]="false" class="grow">
  <mat-drawer
    #drawer
    [opened]="isSideNavOpen()"
    mode="push"
    class="text-xl"
  >
    <app-side-nav />
  </mat-drawer>
  <mat-drawer-content>
    <div class="border-b py-1 pl-3">
      <button matIconButton (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    <main class="p-3">
      <router-outlet />
    </main>
  </mat-drawer-content>
</mat-drawer-container>
